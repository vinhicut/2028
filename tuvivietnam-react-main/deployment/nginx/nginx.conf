server {
    listen 80;
    listen [::]:80;
    server_name tuvihongan.com www.tuvihongan.com;

    client_max_body_size 12m;

    # These endpoints belong to the Node Customer API.
    location ~ ^/api/(admin/article-images|admin/articles|chat|customer-logs|admin/customer-logs|customer-accounts|admin/customer-accounts)(/|$) {
        proxy_pass http://127.0.0.1:3002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Flask serves the frontend and the core API.
    location / {
        proxy_pass http://127.0.0.1:2026;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
