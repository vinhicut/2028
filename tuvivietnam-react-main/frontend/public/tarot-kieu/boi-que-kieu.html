<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" type="image/png" href="/HA.png">
<title>Tử Vi Hồng Ân - Gieo Quẻ Kiều</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Noto+Serif:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--gold:#c9a227;--red:#8b1e1e;--cream:#f8f1e3}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:'Noto Serif',serif;
  background: url("nen-tarot-kieu.png") center top / cover no-repeat fixed;
  min-height:100vh;
  color:var(--cream);
  overflow-x:hidden;
}
header{text-align:center;height:120px;position:relative;pointer-events:none} h1, .subtitle{opacity:0;visibility:hidden;}
body.deck-mode header{display:block;height:120px;padding:12px 0 0}
body.deck-mode h1{opacity:0;visibility:hidden}
header::before{display:none}
h1{font-family:'Playfair Display',serif;font-size:clamp(1.6rem,5vw,2.5rem);color:var(--gold);text-shadow:0 2px 12px rgba(0,0,0,.7);letter-spacing:2px}
.subtitle{font-size:.95rem;opacity:.85;margin-top:3px;font-style:italic}
.container{
  max-width:1280px;
  margin:0 auto;
  padding:12px 16px 40px;
  background:rgba(15,10,8,0.30);
  border-radius:18px;
  border:1px solid rgba(201,162,39,0.30);
}
.spinner-section{display:flex;flex-direction:column;align-items:center;gap:14px;margin:14px 0 22px}
.wheel-wrapper{position:relative;width:min(320px,88vw);height:min(320px,88vw)}
.wheel{
  width:100%;height:100%;
  position:relative;
  border-radius:50%;
  overflow:visible;
  transition:transform 4.8s cubic-bezier(.12,.75,.08,1);
  filter:drop-shadow(0 0 18px rgba(201,162,39,.45));
}
.wheel-image{
  position:absolute;inset:0;z-index:1;
  width:100%;
  height:100%;
  display:block;
  object-fit:contain;
  border-radius:50%;
  user-select:none;
  -webkit-user-drag:none;
}
.wheel-numbers{position:absolute;inset:0;z-index:2;display:block;pointer-events:none}
.wheel-numbers span{
  position:absolute;width:44px;height:32px;transform:translate(-50%,-50%);
  font-size:.72rem;font-weight:700;color:#f8e9b0;text-shadow:0 1px 3px #000;
  display:flex;align-items:center;justify-content:center;
}
.wheel-center{display:none}
.pointer{position:absolute;top:-15px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent;border-top:30px solid var(--gold);filter:drop-shadow(0 3px 6px rgba(0,0,0,.5));z-index:10}
.spin-btn{background:linear-gradient(145deg,#c9a227,#a07d1a);color:#2c1810;border:none;padding:12px 38px;font-size:1.2rem;font-weight:700;border-radius:50px;cursor:pointer;box-shadow:0 5px 18px rgba(201,162,39,.4);transition:all .25s;font-family:'Playfair Display',serif;letter-spacing:1px}
.spin-btn:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 9px 22px rgba(201,162,39,.55)}
.spin-btn:disabled{opacity:.55;cursor:not-allowed}
.result-number{font-size:1.4rem;color:var(--gold);min-height:36px;font-weight:700;letter-spacing:1px}
.cards-title{text-align:center;font-size:1.25rem;color:var(--gold);margin:6px 0 16px}
body:not(.deck-mode) .cards-title{display:none}
.cards-title::after{content:"";display:block;width:90px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:5px auto 0}
.cards-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;justify-items:center}
@media(max-width:900px){.cards-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){.cards-grid{grid-template-columns:1fr 1fr;gap:10px}}
.card{width:100%;max-width:230px;background:linear-gradient(160deg,#f8f1e3,#e8d9b8);border-radius:12px;overflow:hidden;box-shadow:0 7px 20px rgba(0,0,0,.45);border:3px solid var(--gold);cursor:pointer;transition:transform .28s,box-shadow .28s}
.card:hover{transform:translateY(-5px) scale(1.03);box-shadow:0 12px 28px rgba(201,162,39,.4)}
.card.main-card{border-width:4px;box-shadow:0 9px 26px rgba(201,162,39,.55)}
.card-img-wrap{width:100%;aspect-ratio:3/4;background:#2c1810;overflow:hidden;display:flex;align-items:center;justify-content:center}
.card-img-wrap img{width:100%;height:100%;object-fit:cover;display:block}
.card-header{background:linear-gradient(90deg,#8b1e1e,#a52a2a);color:#f8e9b0;text-align:center;padding:6px 5px;font-weight:700;font-size:.95rem;letter-spacing:1px}
/* .card-body{padding:8px;color:#2c1810;min-height:64px;display:flex;flex-direction:column;justify-content:center} */
.verse{font-size:.78rem;line-height:1.4;text-align:center;font-weight:500}
.verse .line1{margin-bottom:2px}
.card-footer{background:#2c1810;color:var(--gold);text-align:center;padding:4px;font-size:.72rem}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:1000;display:none;align-items:center;justify-content:center;padding:12px;backdrop-filter:blur(5px)}
.modal-overlay.show{display:flex;animation:fadeIn .22s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal-content{position:relative;max-width:min(400px,94vw);max-height:92vh;background:#1a0f0a;border-radius:14px;border:4px solid var(--gold);box-shadow:0 0 40px rgba(201,162,39,.4);overflow:hidden;animation:scaleIn .28s ease}
@keyframes scaleIn{from{transform:scale(.88);opacity:0}to{transform:scale(1);opacity:1}}
.modal-img{width:100%;display:block;max-height:75vh;object-fit:contain;background:#2c1810}
.modal-info{padding:10px 14px 14px;text-align:center;background:linear-gradient(180deg,#2c1810,#1a0f0a)}
.modal-info h3{color:var(--gold);font-size:1.25rem;margin-bottom:5px}
/* .modal-info p{font-size:.9rem;line-height:1.5} */
.modal-close{position:absolute;top:8px;right:10px;width:34px;height:34px;border-radius:50%;background:rgba(0,0,0,.65);border:2px solid var(--gold);color:var(--gold);font-size:1.35rem;cursor:pointer;display:flex;align-items:center;justify-content:center;z-index:10}
.modal-close:hover{background:var(--red)}
footer{text-align:center;padding:18px 12px 30px;font-size:.82rem;opacity:.65}
</style>
</head>
<body>
<header><h1>BÓI QUẺ KIỀU</h1><p class="subtitle">Gieo Quẻ On line</p></header>
<div class="container">
<section class="spinner-section">
<div class="wheel-wrapper">
<div class="pointer"></div>
<div class="wheel" id="wheel"><img class="wheel-image" src="/BatQuai.png" alt="Chiếc nón kỳ diệu" draggable="false"><div class="wheel-numbers" id="wheelNums"></div></div>
<div class="wheel-center" id="centerNum">?</div>
</div>
<button class="spin-btn" id="spinBtn" onclick="spinWheel()">XIN QUẺ</button>
<div class="result-number" id="resultText">Nhấn nút để quay số quẻ</div>
</section>
<h2 class="cards-title" id="cardsTitle">Tám Quẻ Được Chọn</h2>
<div class="cards-grid" id="cardsContainer"></div>
</div>
<footer>Tham vấn thi thánh Nguyễn Du • Đạo cô Tam Hợp • Sư trưởng Giác Duyên • Giáng tiên Thúy Kiều</footer>
<div class="modal-overlay" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-content">
<button class="modal-close" onclick="closeModal()">&times;</button>
<img class="modal-img" id="modalImg" src="" alt="Quẻ">
<div class="modal-info"><h3 id="modalTitle">Quẻ</h3><p id="modalVerse"></p></div>
</div>
</div>
<script>
const queData={};
for(let i=1;i<=210;i++) queData[i]={l1:""+i,l2:"" };
Object.assign(queData,{
  1:{l1:"Thông minh vốn sẵn tính trời",l2:"Nhẹ nhàng kiếp trước, đền bồi duyên sau"},
  2:{l1:"Tan sương vừa rạng ngày mai",l2:"Trụ trì nghe tiếng rước mời vào trong"},
  3:{l1:"Nâu sồng từ trở màu thiền",l2:"Mặn khen nét bút càng nhìn càng tươi"},
  4:{l1:"Bây giờ rõ mặt đôi ta",l2:"Tu là cội phúc, tình là dây oan"},
  5:{l1:"Song thu đã khép cánh ngoài",l2:"Hay là khổ tận đến ngày cam lai?"},
  101:{l1:"Trời còn để có hôm nay",l2:"Của tin gọi một chút này làm ghi"},
  102:{l1:"Trùng sinh ân nặng bể trời",l2:"Mà lòng trọng nghĩa khinh tài xiết bao!"},
  150:{l1:"Thường vì hạnh trọng vì tài",l2:"Sao cho trong ấm thì ngoài mới êm"},
  200:{l1:"Ai ngờ lại hợp một nhà",l2:"Một thiên tuyệt bút gọi là để sau"},
  210:{l1:"Gió quang mây tạnh thảnh thơi",l2:"Có người đàn việt lên chơi cửa già"}
});

function imgSrc(n){
  const deck = new URLSearchParams(window.location.search).get("deck");
  if(deck === "giap-thien-di"){
    return `cards-giap-thien-di/Que-${String(n).padStart(2, '0')}.png`;
  }
  if(["can-tai-loc", "kham-cong-danh", "can-nien-van"].includes(deck)){
    return `cards-can-kham-can/${deck}/Que-${String(n).padStart(2, '0')}.png`;
  }
  if(["ly-binh-an", "khon-hon-nhan", "doai-thuong-mai"].includes(deck)){
    return `cards-ly-khon-doai/${deck}/Que-${String(n).padStart(2, '0')}.png`;
  }
  if(["at-tat-benh", "binh-khoa-do", "dinh-tu-tuc", "mau-xuat-hanh"].includes(deck)){
    return `cards-at-binh-dinh-mau/${deck}/Que-${String(n).padStart(2, '0')}.png`;
  }
  if(["ky-truy-tim", "canh-uu-tu", "tan-tham-yet", "nham-ky-nghe", "quy-tam-su"].includes(deck)){
    return `cards-ky-canh-tan-nham-quy/${deck}/Que-${String(n).padStart(2, '0')}.png`;
  }
  if(deck === "chan-am-tin" || deck === "ton-tranh-tung"){
    return `cards-chan-ton/${deck}/Que-${String(n).padStart(2, '0')}.png`;
  }
  const padded = String(n).padStart(3, '0');
  return "cards/Que-" + padded + ".png";
}

// The artwork has 12 sectors; each spin assigns them 12 distinct quẻ from 1-210.
const SEGMENTS = 12;
const SEG_ANGLE = 360 / SEGMENTS; // 30 độ
const activeDeck = new URLSearchParams(window.location.search).get("deck");
const deckSize = ["giap-thien-di", "chan-am-tin", "ton-tranh-tung", "can-tai-loc", "kham-cong-danh", "can-nien-van", "ly-binh-an", "khon-hon-nhan", "doai-thuong-mai", "at-tat-benh", "binh-khoa-do", "dinh-tu-tuc", "mau-xuat-hanh", "ky-truy-tim", "canh-uu-tu", "tan-tham-yet", "nham-ky-nghe", "quy-tam-su"].includes(activeDeck) ? 15 : 210;
const deckLabels = {
  "giap-thien-di": "THIÊN DI – QUẺ GIÁP (Thay đổi chỗ ở/chỗ làm tốt hay xấu?)",
  "chan-am-tin": "ÂM TÍN – QUẺ CHẤN (Hỏi tin tức người ở xa)",
  "ton-tranh-tung": "TRANH TỤNG – QUẺ TỐN (Kiện cáo, thị phi lợi hay hại?)",
  "can-tai-loc": "NIÊN VẬN – QUẺ CÀN (Năm nay tốt hay xấu?)",
  "kham-cong-danh": "CÔNG DANH – QUẺ KHẢM (Thăng tiến sớm hay muộn?)",
  "can-nien-van": "TÀI LỘC – QUẺ CẤN (Tiền của dồi dào hay hao hụt?)",
  "ly-binh-an": "BÌNH AN – QUẺ LY (Vận gia đình có được bình an?)",
  "khon-hon-nhan": "HÔN NHÂN – QUẺ KHÔN (Vợ chồng tốt hay xấu?)",
  "doai-thuong-mai": "BUÔN BÁN – QUẺ ĐOÀI (Buôn bán lỗ hay lãi?)",
  "at-tat-benh": "TẬT BỆNH – QUẺ ẤT (Bệnh nặng hay nhẹ?)",
  "binh-khoa-do": "KHOA ĐỖ – QUẺ BÍNH (Thi cử, thăng tiến được chăng?)",
  "dinh-tu-tuc": "TỬ TỨC – QUẺ ĐINH (Đường con cái tốt hay xấu?)",
  "mau-xuat-hanh": "XUẤT HÀNH – QUẺ MẬU (Ra đi có gặp may không?)",
  "ky-truy-tim": "TRUY TÌM – QUẺ KỶ (Có tìm thấy vật thất lạc/mất không?)",
  "canh-uu-tu": "ƯU TƯ – QUẺ CANH (Hỏi việc lành hay dữ?)",
  "tan-tham-yet": "THÁM YẾT – QUẺ TÂN (Đi thăm hỏi, thăm viếng được không?)",
  "nham-ky-nghe": "KỸ NGHỆ – QUẺ NHÂM (Nghề nghiệp lợi hay hại?)",
  "quy-tam-su": "TÂM SỰ – QUẺ QUÝ (Tình riêng có toại ý hay không?)"
};
if(deckLabels[activeDeck]){
  document.body.classList.add("deck-mode");
  const groupLabel = "Xin quẻ chi tiết từng việc";
  document.querySelector("header .subtitle").textContent = "Bộ quẻ " + groupLabel + " • " + deckSize + " quẻ";
  document.getElementById("cardsTitle").textContent = "Các quẻ " + deckLabels[activeDeck];
  document.title = "Tử Vi Hồng Ân - " + deckLabels[activeDeck];
}
let currentNumbers = [];
let currentRotation = 0; // góc quay hiện tại của wheel (độ)

function buildWheelNumbers(){
  const selectedNumbers = new Set();
  while(selectedNumbers.size < SEGMENTS){
    selectedNumbers.add(Math.floor(Math.random() * deckSize) + 1);
  }
  currentNumbers = Array.from(selectedNumbers);

  const el = document.getElementById("wheelNums");
  const wheel = document.getElementById("wheel");
  if(!el || !wheel) return;

  const size = wheel.clientWidth;
  const radius = size * 0.36;
  el.innerHTML = "";

  currentNumbers.forEach((number, index) => {
    const angle = (-90 + index * SEG_ANGLE) * Math.PI / 180;
    const label = document.createElement("span");
    label.textContent = number;
    label.setAttribute("aria-label", `Quẻ ${number}`);
    label.style.left = `${size / 2 + Math.cos(angle) * radius}px`;
    label.style.top = `${size / 2 + Math.sin(angle) * radius}px`;
    el.appendChild(label);
  });
}

let isSpinning = false;

function spinWheel(){
  if(isSpinning) return;
  isSpinning = true;

  const btn = document.getElementById("spinBtn");
  const wheel = document.getElementById("wheel");
  const center = document.getElementById("centerNum");
  const resultText = document.getElementById("resultText");

  btn.disabled = true;
  resultText.textContent = "Đang bốc quẻ...";
  center.textContent = "...";

  // Randomize all 12 displayed labels from the active deck.
  buildWheelNumbers();

  // Select one of the displayed numbers so the pointer and result always match.
  const stopIndex = Math.floor(Math.random() * SEGMENTS);
  const target = currentNumbers[stopIndex];

  // Each sector is 30 degrees, starting at the top and moving clockwise.
  // Phải tính cả góc hiện tại để những lần quay thứ 2, 3... vẫn dừng chính xác.
  // Góc cần bù để ô stopIndex nằm đúng dưới mũi tên: 
  // (360 - (góc hiện tại + góc của ô)) mod 360.
  const baseAngle = (360 - ((currentRotation % 360) + stopIndex * SEG_ANGLE) % 360) % 360;

  // 4. Quay thêm nhiều vòng cho đẹp
  const extraSpins = 6 + Math.floor(Math.random() * 4); // 6–9 vòng
  const finalRotation = currentRotation + extraSpins * 360 + baseAngle;

  // Cập nhật góc hiện tại (giữ mod lớn để transition mượt)
  currentRotation = finalRotation;

  wheel.style.transform = "rotate(" + finalRotation + "deg)";

  setTimeout(function(){
    center.textContent = target;
    resultText.innerHTML = "✦ Quẻ số <strong style='font-size:1.35em'>" + target + "</strong> ✦";
    showEightCards(target);
    openModal(target);
    btn.disabled = false;
    isSpinning = false;
  }, 4900);
}

function showEightCards(mainNum){
  const container = document.getElementById("cardsContainer");
  container.innerHTML = "";
  const others = new Set();
  while(others.size < 7){
    const n = Math.floor(Math.random()*deckSize)+1;
    if(n !== mainNum) others.add(n);
  }
  const nums = [mainNum].concat(Array.from(others));
  nums.forEach(function(num, idx){
    const data = queData[num];
    const isMain = idx === 0;
    const card = document.createElement("div");
    card.className = "card" + (isMain ? " main-card" : "");
    card.onclick = function(){ openModal(num); };
    card.innerHTML =
      '<div class="card-header">QUẺ ' + num + '</div>' +
      '<div class="card-img-wrap"><img src="' + imgSrc(num) + '" alt="Quẻ ' + num + '" loading="lazy" onerror="if(!this.dataset.fb){this.dataset.fb=1;this.src=\'cards/que' + num + '.jpg\';}else if(this.dataset.fb==1){this.dataset.fb=2;this.src=\'card1s/que' + num + '.jpg\';}else{this.parentElement.innerHTML=\'<div style=color:#f8e9b0;text-align:center;padding:20px>Quẻ ' + num + '</div>\';}"></div>' +
     /*  '<div class="card-body"><div class="verse"><div class="line1">' + data.l1 + '</div><div>' + data.l2 + '</div></div></div>' + */
      '<div class="card-footer">' + (isMain ? "★ Quẻ chính" : "Quẻ phụ") + " • Bấm xem</div>";
    container.appendChild(card);
  });
}

function openModal(num){
  const data = queData[num];
  document.getElementById("modalTitle").textContent = "Quẻ số " + num;
 /*  document.getElementById("modalVerse").innerHTML = data.l1 + "<br>" + data.l2; */
  const img = document.getElementById("modalImg");
  img.style.display = "block";
  img.src = imgSrc(num);
  img.dataset.fb = "";
  img.onerror = function(){
    if(!this.dataset.fb){
      this.dataset.fb = "1";
      this.src = "cards/que" + num + ".jpg";
    } else if(this.dataset.fb === "1"){
      this.dataset.fb = "2";
      this.src = "card1s/que" + num + ".jpg";
    } else {
      this.style.display = "none";
    }
  };
  document.getElementById("modal").classList.add("show");
  document.body.style.overflow = "hidden";
}
function closeModal(){
  document.getElementById("modal").classList.remove("show");
  document.body.style.overflow = "";
}
document.addEventListener("keydown", function(e){ if(e.key === "Escape") closeModal(); });

window.onload = function(){
  buildWheelNumbers();
  showEightCards(Math.floor(Math.random()*deckSize)+1);
};
</script>
</body>
</html>
