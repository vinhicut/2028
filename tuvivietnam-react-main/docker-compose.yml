services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    expose:
      - "2026"
    volumes:
      - tuvi_app_data:/app/backend/data
    environment:
      HOST: 0.0.0.0
      PORT: 2026
      CORS_ORIGIN: ${CORS_ORIGIN:-https://tuvihongan.com}
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY in the project .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_IDS: ${GOOGLE_CLIENT_IDS:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      FIREBASE_PROJECT_ID: ${FIREBASE_PROJECT_ID:-tu-vi-hong}
      FIREBASE_CREDENTIALS_PATH: ${FIREBASE_CREDENTIALS_PATH:-/app/security/keys-and-secrets/firebase-service-account.json}
      MANAGER_EMAILS: ${MANAGER_EMAILS:-admin@tuvihongan.com,quanly@tuvihongan.com,nguyenvinhvan90@gmail.com}
      SUPER_ADMIN_EMAILS: ${SUPER_ADMIN_EMAILS:-}
      CUSTOMER_API_URL: http://customer-api:3001
      BOOKING_NOTIFICATION_EMAIL: ${BOOKING_NOTIFICATION_EMAIL:-nguyenvinhvan90@gmail.com}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:2026/api/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      customer-api:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-tuvi_hongan}
      MYSQL_USER: ${DB_USER:-tuvi_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in the project .env}
    volumes:
      - tuvi_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  customer-api:
    build:
      context: ./backend-node
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3001"
    environment:
      PORT: 3001
      CORS_ORIGIN: ${CORS_ORIGIN:-https://tuvihongan.com}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-tuvi_hongan}
      DB_USER: ${DB_USER:-tuvi_app}
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the project .env}
      AUTH_ME_URL: http://web:2026/api/auth/me
      CHART_IMAGE_DIR: /app/storage/chart-images
    volumes:
      - tuvi_chart_images:/app/storage
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mysql:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deployment/Caddyfile:/etc/caddy/Caddyfile:ro
      - tuvi_caddy_data:/data
      - tuvi_caddy_config:/config
    depends_on:
      web:
        condition: service_healthy
      customer-api:
        condition: service_healthy

volumes:
  tuvi_app_data:
  tuvi_mysql_data:
  tuvi_chart_images:
  tuvi_caddy_data:
  tuvi_caddy_config:
